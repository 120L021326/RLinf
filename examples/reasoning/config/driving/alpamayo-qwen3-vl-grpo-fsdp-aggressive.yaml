defaults:
  - ../training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
    rollout: 4-7
    reward: 4-4

runner:
  task_type: reasoning
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"]
  max_epochs: 2
  max_steps: 100
  val_check_interval: 1000
  save_interval: 1000
  seq_length: 1024
  enable_dynamic_batch_size: False
  max_tokens_per_mbs: 32768
  resume_dir: null
  experiment_name: alpamayo-qwen3-vl-coc-grpo-aggressive
  output_dir: ../results

algorithm:
  group_size: 2
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null
  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 1
  recompute_logprobs: False
  shuffle_rollout: False
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: False
  adv_type: grpo
  normalize_advantages: True
  early_stop_imp_ratio: 5.0
  use_valid_token_scale: False
  sampling_params:
    do_sample: True
    temperature: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: ${subtract:${runner.seq_length}, ${data.max_prompt_length}}
    min_new_tokens: 1
    stop_token_ids: [155681]

rollout:
  group_name: "RolloutGroup"
  gpu_memory_utilization: 0.40
  model:
    model_path: "/workspace/Alpamayo-R1-10B-vlm"
    model_type: qwen3_vl
    precision: ${actor.model.precision}
  enforce_eager: False
  distributed_executor_backend: mp
  disable_log_stats: False
  detokenize: False
  padding: null
  eos: null
  rollout_backend: sglang
  vllm:
    attention_backend: FLASH_ATTN
    enable_chunked_prefill: True
    enable_prefix_caching: True
    enable_flash_infer_sampler: True
  sglang:
    attention_backend: triton
    decode_log_interval: 100
    use_torch_compile: False
    torch_compile_max_bs: 4
  return_logprobs: ${not:${algorithm.recompute_logprobs}}
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  validate_weight: False
  validate_save_dir: null
  print_outputs: False
  max_running_requests: 1
  cuda_graph_max_bs: 1

data:
  type: vision_language
  dataset_name: alpamayo_coc
  max_prompt_length: 896
  filter_prompt_by_length: True
  rollout_batch_size: 4
  val_rollout_batch_size: 4
  num_frames: 1
  camera_features: ["camera_front_wide_120fov"]
  num_workers: 0
  use_chat_template: False
  lazy_loading: True
  shuffle: True
  validation_shuffle: False
  seed: 1234
  traj_vocab_size: 4000
  predict_yaw: False
  traj_token_start_idx: 151669
  hist_traj_token_start_idx: 154669
  prompt_key: prompt
  image_keys: ["image"]
  ncore_manifest_path: "/path/to/alpamayo_ncore_manifest.json"
  ncore_root: "/path/to/alpamayo_ncore_root"
  extract_cache_dir: "/path/to/extract_cache_dir"
  train_data_paths: ["/workspace/ncore_10clips/train.jsonl"]
  val_data_paths: ["/workspace/ncore_10clips/val.jsonl"]

actor:
  group_name: "ActorGroup"
  training_backend: fsdp
  mcore_gpt: True
  spec_name: decoder_gpt
  enable_offload: True
  global_batch_size: 2
  micro_batch_size: 1
  enable_dp_load_balance: False
  calculate_flops: False
  seed: 1234
  model:
    model_type: ${rollout.model.model_type}
    model_path: ${rollout.model.model_path}
    precision: bf16
    sharding_strategy: full_shard
    is_lora: False
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
  optim:
    optimizer: adam
    bf16: True
    fp16: False
    lr: 2e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    min_lr: 2.0e-7
    weight_decay: 0.05
    use_distributed_optimizer: True
    overlap_grad_reduce: False
    overlap_param_gather: False
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: False
    clip_grad: 0.8
    loss_scale: 65536
  lr_sched:
    lr_warmup_fraction: 0.01
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 2e-6
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 10
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: False
    trust_remote_code: True
    padding_side: right
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: False
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: True
    enable_gradient_accumulation: True
    forward_prefetch: False
    limit_all_gathers: False
    backward_prefetch: null
    use_orig_params: False
    use_liger_kernel: False
    fsdp_size: -1
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: False
      precision: bf16
    grad_scaler:
      enabled: False

reward:
  group_name: "RewardGroup"
  use_reward_model: false
  reward_type: alpamayo_format
  reward_scale: 1.0
  require_non_empty: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: False
    trust_remote_code: True
    padding_side: right
    
inference:
  group_name: "InferenceGroup"
  model:
    is_lora: false
    model_type: qwen3_vl
    model_path: /workspace/Alpamayo-R1-10B-vlm
    precision: bf16
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
  tokenizer:
    tokenizer_model: /workspace/Alpamayo-R1-10B-vlm
    use_fast: false
    trust_remote_code: true
    padding_side: right
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    fsdp_size: -1
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: "bf16"
    grad_scaler:
      enabled: false


critic:
  use_critic_model: false
